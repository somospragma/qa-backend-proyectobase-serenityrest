buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "net.serenity-bdd:serenity-gradle-plugin:3.7.0"
        classpath "net.serenity-bdd:serenity-single-page-report:3.7.0"
    }
}

plugins {
    id "net.serenity-bdd.serenity-gradle-plugin" version "3.7.0"
    id 'eclipse'
    id 'idea'
    id 'java'
    id "org.sonarqube" version "4.0.0.2929"
}


defaultTasks 'clean', 'test', 'aggregate'

repositories {
    mavenCentral()
}

sourceCompatibility = 16
targetCompatibility = 16

ext {
    slf4jVersion = '1.7.7'
    serenityCoreVersion = '3.7.1'
    serenityCucumberVersion = '3.7.1'
    junitVersion = '5.9.2'
    assertJVersion = '3.8.0'
    logbackVersion = '1.4.6'
    lombokVersion = '1.18.26'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-junit5:${serenityCoreVersion}",
            "org.junit.jupiter:junit-jupiter-api:${junitVersion}",
            "org.junit.jupiter:junit-jupiter-engine:${junitVersion}",
            "org.assertj:assertj-core:${assertJVersion}",
            "org.projectlombok:lombok:${lombokVersion}",
            "ch.qos.logback:logback-classic:${logbackVersion}",

            "net.serenity-bdd:serenity-cucumber:${serenityCucumberVersion}",
            "net.serenity-bdd:serenity-screenplay:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-screenplay-webdriver:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-screenplay-rest:${serenityCoreVersion}",
            "net.serenity-bdd:serenity-ensure:${serenityCoreVersion}"

    implementation 'io.rest-assured:json-schema-validator:4.5.1'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:11.2.3.jre17'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.0'
    implementation 'com.zaxxer:HikariCP:4.0.3'
    implementation 'com.github.javafaker:javafaker:1.0.2'
    implementation 'org.mongodb:mongo-java-driver:3.12.14'

    testRuntimeOnly 'io.cucumber:cucumber-junit-platform-engine:7.11.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.9.2'

    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testCompileOnly 'junit:junit:4.13.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.4.0'
}

gradle.startParameter.continueOnFailure = true

//Single
test {
    String executionType = System.properties['ExecutionTypeSingle']
    systemProperty 'environment', System.properties['environment']
    systemProperty "ExecutionTypeSingle", executionType
    useJUnit()

    switch (executionType) {
        case "@tag1":
            include('*/runnertag1.class')
            maxParallelForks = 1
            break
        case "@tag2":
            include('*/RunnerTag2.class')
            maxParallelForks = 1
            break

    }
}

//Parallel
test {
    String executionType = System.properties['ExecutionTypeParallel']
    systemProperty "ExecutionTypeParallel", executionType

    useJUnitPlatform()
    systemProperty("cucumber.junit-platform.naming-strategy", "long")

    switch (executionType) {
        case "@tag":
            include('*/Runner.class')
            break
    }
}


serenity {
    reports = ["single-page-html"]
    testRoot = "qa-backend-proyectobase-serenityrest/src/test"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test.finalizedBy(aggregate)